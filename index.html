<style>
:root{--bg:#f4eddf;--card:rgba(255,255,255,.42);--ink:#26342b;--mut:#6d7a6e;--line:rgba(70,90,70,.14);--acc:#5f8a63;--accbg:rgba(95,138,99,.16);--p:#5b84b8;--c:#d79b4a;--f:#b5779a;--bad:#c1553f;--edge:rgba(255,255,255,.65);--hi:rgba(255,255,255,.75);--b1:rgba(160,200,150,.55);--b2:rgba(240,190,140,.45);--b3:rgba(190,215,200,.5);--r:22px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

:root[data-theme="dark"]{--bg:#121a15;--card:rgba(255,255,255,.07);--ink:#eaf1e8;--mut:#9aab9d;--line:rgba(255,255,255,.12);--acc:#8dc493;--accbg:rgba(141,196,147,.18);--p:#85acdf;--c:#efb869;--f:#d79bbd;--bad:#ef8a73;--edge:rgba(255,255,255,.14);--hi:rgba(255,255,255,.12);--b1:rgba(80,130,90,.35);--b2:rgba(150,100,60,.25);--b3:rgba(60,110,110,.3);color-scheme:dark}

*{box-sizing:border-box}

h1{font-size:24px;font-weight:700;letter-spacing:-.4px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--edge);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 10px 30px rgba(50,70,50,.1),inset 0 1px 0 var(--hi)}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) input,:root:not([data-theme="light"]) select,:root:not([data-theme="light"]) textarea{background:rgba(255,255,255,.06)}}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn{background:linear-gradient(180deg,#7ba87f,#58845e);color:#fff;border:0;border-radius:14px;padding:10px 16px;font-weight:600;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 12px rgba(80,120,80,.25)}
.btn.alt{background:var(--accbg);color:var(--acc);box-shadow:inset 0 1px 0 var(--hi)}.x{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer;padding:2px 8px}
.item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
nav{position:fixed;left:12px;right:12px;max-width:536px;margin:0 auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:6px;border-radius:30px;background:var(--card);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);border:1px solid var(--edge);box-shadow:0 12px 34px rgba(40,60,40,.18),inset 0 1px 0 var(--hi)}

ol{padding-left:18px;margin:6px 0}li{margin-bottom:4px}
@keyframes sr{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}

.g2>div,.g4>div{min-width:0}

#toast.show{transform:translate(-50%,0)}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;height:46px;line-height:1.2;margin:0;text-align:left}

nav{border-radius:36px / 34px;gap:0;overflow:hidden}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 0 7px;font-size:11px;position:relative;z-index:1;-webkit-tap-highlight-color:transparent}
nav button.on{background:none;box-shadow:none;color:var(--acc)}

.ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:30px;background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(10px) saturate(200%) brightness(1.08);backdrop-filter:blur(10px) saturate(200%) brightness(1.08);border:1px solid var(--edge);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),inset 0 -6px 12px rgba(255,255,255,.2),0 6px 16px rgba(40,70,50,.18);transform:translateX(calc(var(--i,0)*100%));transition:transform .55s cubic-bezier(.25,1,.35,1);z-index:0;pointer-events:none}
.ind.mv{animation:squish .6s ease-out}
@keyframes squish{0%{scale:1 1}30%{scale:1.1 .94}100%{scale:1 1}}
@keyframes rg{from{stroke-dashoffset:var(--C)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ind{background:rgba(255,255,255,.14)}}
:root[data-theme="dark"] .ind{background:rgba(255,255,255,.14)}
@media (prefers-reduced-motion:reduce){.ind,.ind.mv{transition:none;animation:none}svg circle{animation:none!important}}
:root,:root[data-theme="light"]{--bg:#e6dac6;--card:#f4ecdd;--ink:#3b3126;--mut:#7a6b58;--line:#d9ccb4;--acc:#5f6e3a;--accbg:#e3dcc0;--p:#5f7885;--c:#c08a3e;--f:#9c5f55;--bad:#b0482f;--edge:#d3c4a8;--hi:rgba(255,255,255,.3);--inp:#faf5ea;--indbg:#dccdb1;--indbd:#c9b794;--btnink:#fff;--sh:rgba(80,60,30,.16);--b1:transparent;--b2:transparent;--b3:transparent;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141d18;--card:#1e2b24;--ink:#e8efe5;--mut:#9bb0a2;--line:#2d3e34;--acc:#8fc79a;--accbg:#29402f;--p:#7fb0e0;--c:#e8b25e;--f:#d493a3;--bad:#ee8b78;--edge:#2e4036;--hi:rgba(255,255,255,.05);--inp:#16231c;--indbg:#2f4a3b;--indbd:#40614d;--btnink:#10251a;--sh:rgba(0,0,0,.4);--b1:transparent;--b2:transparent;--b3:transparent;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141d18;--card:#1e2b24;--ink:#e8efe5;--mut:#9bb0a2;--line:#2d3e34;--acc:#8fc79a;--accbg:#29402f;--p:#7fb0e0;--c:#e8b25e;--f:#d493a3;--bad:#ee8b78;--edge:#2e4036;--hi:rgba(255,255,255,.05);--inp:#16231c;--indbg:#2f4a3b;--indbd:#40614d;--btnink:#10251a;--sh:rgba(0,0,0,.4);--b1:transparent;--b2:transparent;--b3:transparent;color-scheme:dark}
.card,nav,.ind{-webkit-backdrop-filter:none;backdrop-filter:none}
.card{box-shadow:0 1px 2px var(--sh)}
nav{background:var(--card);box-shadow:0 4px 14px var(--sh)}
.ind{background:var(--indbg)!important;border:1px solid var(--indbd);box-shadow:0 1px 3px var(--sh)}
.btn{background:var(--acc);color:var(--btnink);box-shadow:none}
:root:root:root input,:root:root:root select,:root:root:root textarea{background:var(--inp);box-shadow:none}
nav button{transition:background .3s,color .3s}
@media (prefers-reduced-motion:reduce){#app.sr,#app.sl,.bar i{animation:none}}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
</style></head><body>
<div id="app"></div>
<nav><i class="ind"></i><button data-t="home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg>Home</button><button data-t="today" onclick="go('today')"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6"/></svg>Log</button><button data-t="train" onclick="go('train')"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Training</button><button data-t="streak" onclick="go('streak')"><svg viewBox="0 0 24 24"><path d="M12 3c.5 3.5 4.5 5 4.5 9.5a4.5 4.5 0 0 1-9 0c0-1.7.8-3 1.8-3.8.2 1.5 1 2.3 2 2.3-.3-3.2-.3-5.5.7-8z"/></svg>Streak</button><button data-t="other" onclick="go('other')"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>Other</button></nav>
<script>
const KEY='daily-ledger-v1',$=s=>document.querySelector(s),n=v=>parseFloat(v)||0;
let S={setup:false,profile:{sex:'f',age:30,h:170,w:70,gw:65,act:1.375,rate:0.5,steps:8000},days:{},workouts:[],supps:[{id:'a1',name:'Vitamin D',dose:'2000 IU'},{id:'a2',name:'Omega-3',dose:'1 g'},{id:'a3',name:'Multivitamin',dose:'1 tablet'}]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
let hkBusy=false,hkQuiet=false,hkT=null,hkBack=false,HKMSG='',_hk;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!hkBusy&&!hkQuiet)hkQ()};
const todayStr=()=>new Date().toLocaleDateString('en-CA');
let date=todayStr(),tab=S.setup?'home':'other',sub=S.setup?'sleep':'profile',sd=todayStr();
const blank=()=>({foods:[],steps:0,water:0,weight:null,supps:{}});
const getD=d=>S.days[d]||blank(),setD=d=>S.days[d]||(S.days[d]=blank());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shift=(d,k)=>{const t=new Date(d+'T12:00:00');t.setDate(t.getDate()+k);return t.toLocaleDateString('en-CA')};
const pretty=d=>d===todayStr()?'Today':new Date(d+'T12:00:00').toLocaleDateString(LOC(),{weekday:'short',month:'short',day:'numeric'});
function T(){const p=S.profile;const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==='m'?5:-161),tdee=bmr*p.act;
 const dir=p.gw<p.w?-1:p.gw>p.w?1:0,floor=p.sex==='m'?1500:1200;let k=Math.round(Math.max(tdee+dir*p.rate*1100,floor));
 const pr=Math.round(1.8*p.w),fat=Math.round(k*.25/9),carb=Math.max(0,Math.round((k-pr*4-fat*9)/4));
 return{bmr:Math.round(bmr),tdee:Math.round(tdee),kcal:k,pr,fat,carb,fiber:Math.round(k/1000*14),water:Math.round(p.w*35),floored:dir<0&&tdee-p.rate*1100<floor}}
const bar=(l,v,m,c,u)=>`<div class="row sp"><span>${l}</span><span class="mut">${v<10?Math.round(v*10)/10:Math.round(v)} / ${m} ${u}</span></div><div class="bar"><i style="width:${Math.min(100,m?v/m*100:0)}%;background:${c}"></i></div>`;
const tot=d=>getD(d).foods.reduce((a,f)=>({k:a.k+f.k,p:a.p+f.p,c:a.c+f.c,f:a.f+f.f,fi:a.fi+(f.fi||0)}),{k:0,p:0,c:0,f:0,fi:0});
let dir='';const order=['home','today','train','streak','other'],SUB=['scan','badges'];
function go(t){if(t!==tab)dir=(SUB.includes(t)?9:order.indexOf(t))>(SUB.includes(tab)?9:order.indexOf(tab))?'r':'l';tab=t;render()}
let tx=0,ty=0;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)<80||Math.abs(dy)>Math.abs(dx)*.6||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const i=order.indexOf(tab)+(dx<0?1:-1);if(order[i])go(order[i])},{passive:true});
function vToday(){const t=T(),d=getD(date),s=tot(date),left=t.kcal-s.k;
 return `<div class="row sp"><button class="x" onclick="date=shift(date,-1);dir='l';render()" aria-label="Previous day">‹</button><h1>${pretty(date)}</h1><button class="x" onclick="date=shift(date,1);dir='r';render()" aria-label="Next day">›</button></div>
<div class="card"><div class="row sp"><div><div class="big" style="color:${left<0?'var(--bad)':'var(--acc)'}">${Math.abs(Math.round(left))}</div><div class="mut">kcal ${left<0?'over target':'left'} · target ${t.kcal}</div></div><div class="mut" style="text-align:right">${Math.round(s.k)} eaten${(()=>{const b=S.workouts.filter(w=>w.d===date).reduce((a,w)=>a+w.k,0);return b?'<br>'+b+' burned':''})()}</div></div>
<div class="bar"><i style="width:${Math.min(100,s.k/t.kcal*100)}%;background:${left<0?'var(--bad)':'var(--acc)'}"></i></div>
${bar('Protein',s.p,t.pr,'var(--p)','g')}${bar('Carbs',s.c,t.carb,'var(--c)','g')}${bar('Fat',s.f,t.fat,'var(--f)','g')}${bar('Fiber',s.fi,t.fiber,'var(--acc)','g')}</div>
${surCard()}<div class="card"><div class="row sp" style="margin-bottom:10px"><h2 style="margin:0">Add food</h2><button type="button" class="btn alt" style="padding:7px 12px;font-size:14px" onclick="surprise()">🎲 Surprise me</button></div>${quickAdd()}<textarea id="ed" rows="2" placeholder="Describe it, e.g. 2 scrambled eggs, buttered toast, small orange juice"></textarea><div class="row" style="margin:8px 0 0"><label class="btn alt" style="margin:0;font-size:15px;color:var(--acc);cursor:pointer">📷 Photo<input type="file" accept="image/*" hidden onchange="pick(this)"></label><button type="button" class="btn" style="flex:1" onclick="estimate()">Estimate</button></div><p id="em" class="note" style="margin:6px 0 12px"></p><form onsubmit="addFood(event)"><input id="fn" placeholder="What did you eat?" required style="margin-bottom:8px">
<div class="g4"><div><label>kcal</label><input id="fk" type="number" inputmode="decimal" min="0"></div><div><label>Protein g</label><input id="fp" type="number" inputmode="decimal" min="0"></div><div><label>Carbs g</label><input id="fc" type="number" inputmode="decimal" min="0"></div><div><label>Fat g</label><input id="ff" type="number" inputmode="decimal" min="0"></div></div>
<div class="row sp" style="margin-top:8px"><span class="mut">Leave kcal blank to calculate from macros</span><button class="btn">Add</button></div></form>
${d.foods.map((f,i)=>`<div class="item"><div>${esc(f.n)}<div class="mut">${Math.round(f.k)} kcal · P${Math.round(f.p)} C${Math.round(f.c)} F${Math.round(f.f)}</div></div><button class="x" onclick="delFood(${i})" aria-label="Remove">×</button></div>`).join('')||'<p class="mut" style="margin:12px 0 0">Nothing logged yet. Add your first meal above.</p>'}${d.foods.length?'<button type="button" class="btn alt" style="width:100%;margin-top:10px" onclick="saveMeal()">Save these as a meal</button>':''}</div>
<div class="card"><h2>Body and activity</h2><div class="g2"><div><label>Weight (kg)</label><input type="number" step="0.1" inputmode="decimal" value="${d.weight??''}" onchange="setF('weight',this.value||null)"></div>
<div><label>Steps (goal ${S.profile.steps})</label><input type="number" inputmode="numeric" value="${d.steps||''}" onchange="setF('steps',n(this.value))"></div></div>
<div style="margin-top:10px">${bar('Steps',d.steps,S.profile.steps,'var(--acc)','')}</div>
<div class="row sp"><div style="flex:1"><label>Water (ml, goal ${t.water})</label><input type="number" inputmode="numeric" value="${d.water||''}" onchange="setF('water',n(this.value))"></div><button class="btn alt" style="margin-top:16px" onclick="setF('water',getD(date).water+250)">+250</button></div></div>
<div class="card"><h2>Vitamins and supplements</h2>${S.supps.map(x=>`<label class="chk" style="font-size:15px;color:var(--ink);margin:0"><input type="checkbox" ${d.supps[x.id]?'checked':''} onchange="tick('${x.id}',this.checked)"><span style="flex:1">${esc(x.name)} <span class="mut">${esc(x.dose)}</span></span><button type="button" class="x" onclick="delSupp('${x.id}',event)" aria-label="Remove">×</button></label>`).join('')}
<form onsubmit="addSupp(event)" style="margin-top:10px"><div class="row"><input id="sn" placeholder="Name" required><input id="sd" placeholder="Dose label" style="max-width:120px"></div><div class="row" style="margin-top:8px"><select id="sx"><option value="">Counts toward… (optional)</option>${RDA.map(r=>`<option value="${r[0]}">${r[1]} (${r[3]})</option>`).join('')}</select><input id="sa" type="number" step="any" inputmode="decimal" placeholder="Amount" style="max-width:100px"><button class="btn alt">Add</button></div><p class="note">Use the unit shown. Example: 1000 IU of vitamin D is 25 µg.</p></form></div>`}
function addFood(e){e.preventDefault();const p=n($('#fp').value),c=n($('#fc').value),f=n($('#ff').value);let k=n($('#fk').value);if(!k)k=p*4+c*4+f*9;
 setD(date).foods.push({n:$('#fn').value.trim(),k,p,c,f,fi:EST.fi,mi:EST.mi});EST={fi:0,mi:{}};PH=null;save();render()}
function delFood(i){setD(date).foods.splice(i,1);save();render()}
function setF(k,v){setD(date)[k]=k==='weight'&&v!==null?n(v):v;save();render()}
function tick(id,v){setD(date).supps[id]=v;save()}
function addSupp(e){e.preventDefault();S.supps.push({id:'s'+Date.now(),name:$('#sn').value.trim(),dose:$('#sd').value.trim(),nu:$('#sx').value,amt:n($('#sa').value)});save();render()}
